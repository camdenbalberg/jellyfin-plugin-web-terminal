<div data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-button,emby-input"
     data-controller="__plugin/web_terminal.js">
    <div data-role="content">
        <div class="content-primary">
            <style>
                #key-overlay {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    background: #1e1e1e;
                    border-radius: 8px;
                    padding: 40px;
                    min-height: 300px;
                }
                #key-overlay h2 {
                    color: #d4d4d4;
                    margin-bottom: 8px;
                }
                #key-overlay p {
                    color: #888;
                    margin-bottom: 24px;
                    font-size: 14px;
                }
                #key-form {
                    display: flex;
                    gap: 8px;
                    align-items: center;
                }
                #key-input {
                    background: #2d2d2d;
                    border: 1px solid #444;
                    border-radius: 4px;
                    color: #d4d4d4;
                    font-family: monospace;
                    font-size: 14px;
                    padding: 8px 12px;
                    width: 320px;
                    outline: none;
                }
                #key-input:focus {
                    border-color: #6a9fb5;
                }
                #key-error {
                    color: #cc6666;
                    margin-top: 12px;
                    font-size: 13px;
                    display: none;
                }
                #terminal-container {
                    background: #1e1e1e;
                    border-radius: 8px;
                    padding: 16px;
                    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', 'Monaco', monospace;
                    font-size: 14px;
                    max-height: 70vh;
                    display: none;
                    flex-direction: column;
                }
                #terminal-output {
                    flex: 1;
                    overflow-y: auto;
                    color: #d4d4d4;
                    white-space: pre-wrap;
                    word-wrap: break-word;
                    min-height: 300px;
                    max-height: 60vh;
                    margin-bottom: 8px;
                    line-height: 1.4;
                }
                #terminal-output .cmd-line { color: #6a9fb5; }
                #terminal-output .cmd-text { color: #f0c674; }
                #terminal-output .stdout { color: #d4d4d4; }
                #terminal-output .stderr { color: #cc6666; }
                #terminal-output .exit-code { color: #8abeb7; font-size: 12px; }
                #terminal-output .exit-code.error { color: #cc6666; }
                #terminal-input-row {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    border-top: 1px solid #333;
                    padding-top: 8px;
                }
                #terminal-prompt {
                    color: #6a9fb5;
                    font-weight: bold;
                    user-select: none;
                }
                #terminal-input {
                    flex: 1;
                    background: transparent;
                    border: none;
                    color: #f0c674;
                    font-family: inherit;
                    font-size: inherit;
                    outline: none;
                    caret-color: #f0c674;
                }
                #terminal-cwd {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    margin-bottom: 8px;
                }
                #terminal-cwd label {
                    color: #8abeb7;
                    font-family: monospace;
                    font-size: 13px;
                    white-space: nowrap;
                }
                #cwd-input {
                    flex: 1;
                    background: #2d2d2d;
                    border: 1px solid #444;
                    border-radius: 4px;
                    color: #d4d4d4;
                    font-family: monospace;
                    font-size: 13px;
                    padding: 4px 8px;
                    outline: none;
                }
                #cwd-input:focus { border-color: #6a9fb5; }
            </style>

            <h2 style="margin-bottom: 16px;">Web Terminal</h2>

            <div id="key-overlay">
                <h2>Authentication Required</h2>
                <p>Enter the API key from the plugin settings to access the terminal.</p>
                <div id="key-form">
                    <input id="key-input" type="password" placeholder="API Key" spellcheck="false" autocomplete="off" />
                    <button id="key-submit" is="emby-button" class="raised">Unlock</button>
                </div>
                <div id="key-error">Invalid API key. Check plugin settings for the correct key.</div>
            </div>

            <div id="terminal-container">
                <div id="terminal-cwd">
                    <label>Working Directory:</label>
                    <input id="cwd-input" type="text" value="C:\\" spellcheck="false" />
                </div>
                <div id="terminal-output"></div>
                <div id="terminal-input-row">
                    <span id="terminal-prompt">&gt;</span>
                    <input id="terminal-input" type="text" placeholder="Type a command..." spellcheck="false" autocomplete="off" />
                </div>
            </div>
        </div>
    </div>
</div>
